<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="illlust의 프로필, 이력서, 갤러리를 소개합니다.">
  <title>illlust</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #f4f4f0;
      color: #171717;
    }

    main {
      width: min(36rem, calc(100% - 3rem));
    }

    h1 {
      margin-bottom: 0.5rem;
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: -0.06em;
    }

    p {
      margin: 0 0 2rem;
      color: #666;
    }

    nav {
      display: grid;
      gap: 0.75rem;
    }

    a {
      padding: 1rem 1.25rem;
      border: 1px solid #bbb;
      border-radius: 0.5rem;
      color: inherit;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      border-color: currentColor;
      background: #fff;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #171717;
        color: #f4f4f0;
      }

      p {
        color: #aaa;
      }

      a:hover,
      a:focus-visible {
        background: #242424;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>illlust</h1>
    <p>프로필과 작업 기록을 소개하는 개인 웹사이트입니다.</p>
    <nav aria-label="주요 페이지">
      <a href="/resume/">이력서 보기</a>
      <a href="/gallery/">갤러리 보기</a>
    </nav>
  </main>
</body>
</html>
